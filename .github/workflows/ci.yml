# ---------------------------------------------------------------------------
# Continuous integration for the Spellbound monorepo.
#
# Jobs run in parallel because the Java and JavaScript toolchains are
# independent. A failure in any job blocks the merge; branch protection on
# `main` enforces that all of these must pass.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel superseded runs on the same branch. Pushing a fix to a PR should not
# leave the previous, now-irrelevant run consuming a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  # -------------------------------------------------------------------------
  # Enforces Conventional Commits on the PR title. Because we squash-merge,
  # the PR title becomes the commit message on `main` - so this is what keeps
  # the history readable.
  # -------------------------------------------------------------------------
  commit-lint:
    name: Commit convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Repo default token is read-only; this action posts a commit status
    # (and a comment on failure), which needs write access to both.
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: feat,fix,refactor,perf,test,docs,chore,build,ci
          scopes: api,storefront,admin,ui,client,infra,deps

  # -------------------------------------------------------------------------
  # Backend: compile, unit tests, and integration tests.
  #
  # Integration tests use Testcontainers, which starts real PostgreSQL and
  # Redis containers. Running against the real database rather than H2 is the
  # whole point - H2 silently accepts SQL that Postgres rejects.
  # -------------------------------------------------------------------------
  api:
    name: API - build and test
    runs-on: ubuntu-latest
    # mikepenz/action-junit-report publishes a check run below, which needs
    # write access beyond the repo's read-only default token.
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Build and test
        working-directory: apps/api
        run: ./gradlew build --no-daemon

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()   # report failures too, otherwise the useful output is lost
        with:
          report_paths: 'apps/api/build/test-results/test/*.xml'

  # -------------------------------------------------------------------------
  # Frontend: type-check, lint, unit tests, and production build for both
  # applications. Building is not redundant with type-checking - Next.js
  # catches server/client boundary violations only at build time.
  # -------------------------------------------------------------------------
  web:
    name: Web - lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" field via corepack -
      # do not also pin it here, pnpm/action-setup errors on the conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Unit tests
        run: pnpm -r test -- --run

      - name: Build
        run: pnpm -r build

  # -------------------------------------------------------------------------
  # Verifies the running API matches the committed OpenAPI spec. Without this,
  # the contract-first workflow degrades into a spec nobody updates.
  # -------------------------------------------------------------------------
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Generate spec from the running application
        working-directory: apps/api
        run: ./gradlew generateOpenApiDocs --no-daemon

      - name: Fail if the committed spec has drifted
        run: |
          diff -u apps/api/src/main/resources/openapi.yaml \
                  apps/api/build/openapi.yaml \
            || { echo "::error::OpenAPI spec is out of date. Run 'pnpm generate:api' and commit the result."; exit 1; }

  # -------------------------------------------------------------------------
  # Dependency vulnerability scanning. Fails only on HIGH and CRITICAL -
  # failing on every LOW finding trains people to ignore the job entirely.
  # -------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the filesystem for vulnerable dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true   # no action possible on an unpatched CVE
