# Used only by the `generateOpenApiDocs` Gradle task (see build.gradle.kts),
# which boots this application on a bare CI runner with no Postgres or Redis
# available. Excluding these means the OpenAPI contract check only needs the
# controller layer to start, not a full infrastructure stack.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
