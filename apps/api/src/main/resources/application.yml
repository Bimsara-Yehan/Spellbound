server:
  port: 8080

spring:
  application:
    name: spellbound-api
  # SecurityConfig already permits every request, so the autoconfigured
  # in-memory user (and its noisy random-password log line) is dead weight
  # until #10 replaces it with real JWT authentication.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${DATABASE_USERNAME:commerce}
    password: ${DATABASE_PASSWORD:localdev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    # No safe default in a real environment - the setup guide has every
    # developer generate their own. This fallback only exists so the
    # skeleton boots before issue #10 wires up real JWT auth.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
