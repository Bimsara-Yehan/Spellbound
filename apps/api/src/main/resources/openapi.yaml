openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/reporting/inventory/overview:
    get:
      tags:
      - reporting-controller
      operationId: getInventoryOverview
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryOverviewDto'
  /api/v1/reporting/inventory/low-stock-alerts:
    get:
      tags:
      - reporting-controller
      operationId: getLowStockAlerts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LowStockAlertDto'
  /api/v1/products:
    get:
      tags:
      - product-controller
      operationId: getProducts
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - ARCHIVED
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageProductDto'
    post:
      tags:
      - product-controller
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDto'
  /api/v1/products/{id}:
    get:
      tags:
      - product-controller
      operationId: getProductById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDto'
    put:
      tags:
      - product-controller
      operationId: updateProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDto'
    delete:
      tags:
      - product-controller
      operationId: archiveProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDto'
  /api/v1/products/slug/{slug}:
    get:
      tags:
      - product-controller
      operationId: getProductBySlug
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDto'
  /api/v1/inventory/{variantId}/reserve:
    post:
      tags:
      - inventory-controller
      operationId: reserveStock
      parameters:
      - name: variantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: quantity
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryDto'
  /api/v1/inventory/{variantId}/release:
    post:
      tags:
      - inventory-controller
      operationId: releaseStock
      parameters:
      - name: variantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: quantity
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryDto'
  /api/v1/inventory/{variantId}/adjust:
    post:
      tags:
      - inventory-controller
      operationId: adjustStock
      parameters:
      - name: variantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryDto'
  /api/v1/categories:
    get:
      tags:
      - category-controller
      operationId: getAllCategories
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDto'
    post:
      tags:
      - category-controller
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryDto'
  /api/v1/categories/slug/{slug}:
    get:
      tags:
      - category-controller
      operationId: getCategoryBySlug
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryDto'
  /api/v1/categories/{id}:
    get:
      tags:
      - category-controller
      operationId: getCategoryById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryDto'
  /api/v1/inventory:
    get:
      tags:
      - inventory-controller
      operationId: getAllInventories
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryDto'
  /api/v1/inventory/low-stock:
    get:
      tags:
      - inventory-controller
      operationId: getLowStockInventories
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryDto'
  /api/v1/inventory/{variantId}:
    get:
      tags:
      - inventory-controller
      operationId: getInventory
      parameters:
      - name: variantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryDto'
  /api/v1/inventory/{variantId}/audit:
    get:
      tags:
      - inventory-controller
      operationId: getAuditLogs
      parameters:
      - name: variantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockAdjustmentAuditDto'
components:
  schemas:
    CategoryCreateRequest:
      required:
      - name
      - slug
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
          format: uuid
    CategoryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
          format: uuid
    InventoryDto:
      type: object
      properties:
        variantId:
          type: string
          format: uuid
        quantityOnHand:
          type: integer
          format: int32
        quantityReserved:
          type: integer
          format: int32
        safetyBuffer:
          type: integer
          format: int32
        sellableQuantity:
          type: integer
          format: int32
        lastSyncedAt:
          type: string
          format: date-time
    InventoryOverviewDto:
      type: object
      properties:
        totalProducts:
          type: integer
          format: int64
        totalVariants:
          type: integer
          format: int64
        totalStockOnHand:
          type: integer
          format: int64
        totalStockReserved:
          type: integer
          format: int64
        lowStockVariantCount:
          type: integer
          format: int64
    LowStockAlertDto:
      type: object
      properties:
        variantId:
          type: string
          format: uuid
        sku:
          type: string
        productName:
          type: string
        quantityOnHand:
          type: integer
          format: int32
        quantityReserved:
          type: integer
          format: int32
        safetyBuffer:
          type: integer
          format: int32
        sellableQuantity:
          type: integer
          format: int32
    PageProductDto:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/SortObject'
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        paged:
          type: boolean
        unpaged:
          type: boolean
    ProductCreateRequest:
      required:
      - name
      - slug
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - ARCHIVED
        attributes:
          type: string
        posExternalId:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariantCreateRequest'
    ProductDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryDto'
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - ARCHIVED
        attributes:
          type: string
        posExternalId:
          type: string
        lastSyncedAt:
          type: string
          format: date-time
        syncStatus:
          type: string
          enum:
          - SYNCED
          - PENDING
          - FAILED
          - WEB_ONLY
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariantDto'
    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - ARCHIVED
        attributes:
          type: string
    ProductVariantCreateRequest:
      required:
      - optionValues
      - priceCents
      - sku
      type: object
      properties:
        sku:
          type: string
        optionValues:
          type: string
        priceCents:
          type: integer
          format: int64
        compareAtCents:
          type: integer
          format: int64
        posExternalId:
          type: string
    ProductVariantDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        optionValues:
          type: string
        priceCents:
          type: integer
          format: int64
        compareAtCents:
          type: integer
          format: int64
        posExternalId:
          type: string
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    StockAdjustmentAuditDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        actor:
          type: string
        quantityDelta:
          type: integer
          format: int32
        previousQuantity:
          type: integer
          format: int32
        newQuantity:
          type: integer
          format: int32
        reason:
          type: string
        adjustedAt:
          type: string
          format: date-time
    StockAdjustmentRequest:
      required:
      - actor
      - newQuantity
      - reason
      type: object
      properties:
        newQuantity:
          type: integer
          format: int32
        safetyBuffer:
          type: integer
          format: int32
        actor:
          type: string
        reason:
          type: string
